<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Email Organizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
        }
        .section {
            background-color: #fff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        input[type="text"] {
            padding: 8px;
            width: 250px;
            margin-right: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        .folder {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .folder h3 {
            margin-top: 0;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .folder-box {
            width: 45%;
        }
    </style>
</head>
<body>
    <h1>Simple Email Organizer</h1>

    <!-- Add Email Account -->
    <div class="section">
        <h2>Add Email Account</h2>
        <input type="text" id="emailInput" placeholder="Enter email address" />
        <button onclick="addAccount()">Add Account</button>
        <div id="accountsContainer"></div>
    </div>

    <!-- Add Names to Folder -->
    <div class="section">
        <h2>Add Name to Folder</h2>
        <input type="text" id="nameInput" placeholder="Enter name" />
        <select id="folderSelect"></select>
        <button onclick="addName()">Add Name</button>
        <div class="container">
            <div class="folder-box">
                <h3>Folders for Names</h3>
                <div id="namesFolders"></div>
            </div>
            <div class="folder-box">
                <h3>Accounts</h3>
                <div id="accountsFolder"></div>
            </div>
        </div>
    </div>

    <script>
        const accounts = [];
        const foldersForNames = {};
        const accountsFolderDiv = document.getElementById('accountsFolder');
        const folderSelect = document.getElementById('folderSelect');
        const namesFoldersDiv = document.getElementById('namesFolders');

        function addAccount() {
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();
            if (email && !accounts.includes(email)) {
                accounts.push(email);
                updateAccounts();
                updateFolderOptions();
                emailInput.value = '';
            }
        }

        function updateAccounts() {
            const container = document.getElementById('accountsContainer');
            container.innerHTML = '';
            accounts.forEach(acc => {
                const p = document.createElement('p');
                p.textContent = acc;
                container.appendChild(p);
            });
            // Update accounts display
            accountsFolderDiv.innerHTML = '';
            accounts.forEach(acc => {
                const p = document.createElement('p');
                p.textContent = acc;
                accountsFolderDiv.appendChild(p);
            });
        }

        function updateFolderOptions() {
            folderSelect.innerHTML = '';
            for (const folder in foldersForNames) {
                const option = document.createElement('option');
                option.value = folder;
                option.textContent = folder;
                folderSelect.appendChild(option);
            }
        }

        function addName() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            const folderName = folderSelect.value;
            if (name && folderName) {
                if (!foldersForNames[folderName]) {
                    foldersForNames[folderName] = [];
                }
                foldersForNames[folderName].push(name);
                nameInput.value = '';
                displayFoldersForNames();
            }
        }

        function displayFoldersForNames() {
            namesFoldersDiv.innerHTML = '';
            for (const folder in foldersForNames) {
                const div = document.createElement('div');
                div.className = 'folder';
                const h3 = document.createElement('h3');
                h3.textContent = folder;
                div.appendChild(h3);
                const ul = document.createElement('ul');
                foldersForNames[folder].forEach(name => {
                    const li = document.createElement('li');
                    li.textContent = name;
                    ul.appendChild(li);
                });
                div.appendChild(ul);
                namesFoldersDiv.appendChild(div);
            }
        }
    </script>
</body>
</html>
